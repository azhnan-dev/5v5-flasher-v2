[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "5v5-flasher"
version = "0.2.0"
description = "Flash firmware + ganti mode upstream ONT Huawei (GPON/EPON/XPON) tanpa Windows. Python stdlib saja, jalan di Linux/Termux, plus mode stasiun otomatis colok-cabut."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["huawei", "ont", "eg8145v5", "epon", "gpon", "xpon", "flasher", "termux", "linux", "telnet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Android",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
# Tidak ada dependensi runtime: semuanya memakai standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/azhnan-dev/5v5-flasher-v2"
Repository = "https://github.com/azhnan-dev/5v5-flasher-v2"
Issues = "https://github.com/azhnan-dev/5v5-flasher-v2/issues"

[project.scripts]
# Setelah `pip install -e .` (atau `pipx install .`):
#     $ 5v5-flasher detect
#     $ 5v5-flasher batch
5v5-flasher = "flasher:main"

# ---------------------------------------------------------------------------
# Layout proyek ini sedikit tidak biasa:
#   flasher/flasher.py     -> modul CLI utama (bukan package)
#   flasher/steps/*.py     -> package pendukung (modem_http, telnet_client, ...)
# Jadi root package-dir diarahkan ke folder `flasher/` supaya hasil install
# tetap menghasilkan `import flasher` dan `import steps...`.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "flasher" }
py-modules = ["flasher"]

[tool.setuptools.packages.find]
where = ["flasher"]
include = ["steps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
